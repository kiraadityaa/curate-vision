[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curate-vision"
version = "0.1.0"
description = "End-to-end vision dataset curation & pipeline toolkit: intake, clean, dedup, export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "kiraadityaa", email = "kiraadityaa@users.noreply.github.com" }]
keywords = [
    "computer-vision",
    "dataset",
    "curation",
    "dedup",
    "pipeline",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "imagehash>=4.3.1",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=9.5",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
datasets = ["datasets>=2.14"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]
all = [
    "curate-vision[datasets,dev]",
]

[project.urls]
Homepage = "https://github.com/kiraadityaa/curate-vision"
Repository = "https://github.com/kiraadityaa/curate-vision"
Issues = "https://github.com/kiraadityaa/curate-vision/issues"
Changelog = "https://github.com/kiraadityaa/curate-vision/blob/main/CHANGELOG.md"

[project.scripts]
curate-vision = "curate_vision.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/curate_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["curate_vision"]

[tool.coverage.run]
source = ["curate_vision"]
omit = ["src/curate_vision/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true